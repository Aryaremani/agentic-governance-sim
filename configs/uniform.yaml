# Uniform condition: every agent runs the same local model.
# Parameters tuned so max sustainable regrowth (regrowth_rate * capacity / 4, the peak
# of the logistic curve) is close to the total extraction cap under enforcement, so the
# resource can actually stabilize instead of collapsing in 1-2 rounds.
temperature: 0.7

agents:
  - id: agent_1
    model: qwen2.5:7b
  - id: agent_2
    model: qwen2.5:7b
  - id: agent_3
    model: qwen2.5:7b
  - id: agent_4
    model: qwen2.5:7b

initial_stock: 120
capacity: 200
regrowth_rate: 0.35            # max regrowth ~= 0.35*200/4 = 17.5 per round
sustainability_threshold: 25
max_catch_per_agent: 10
sustainable_cap_per_agent: 2   # 4 agents * 2 = 8; equilibrium stock lands just above the collapse threshold
fine_multiplier: 2.0

phases:
  - name: no_enforcement
    enforcement_active: false
    n_rounds: 10
  - name: enforcement_active
    enforcement_active: true
    n_rounds: 15
  - name: enforcement_withdrawn
    enforcement_active: false
    n_rounds: 20
